<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso restringido · Crear perfil</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="page-container" style="display:flex; align-items:center; min-height:100vh; padding-top:0; padding-bottom:0;">
        <div class="glass-card fade-in" style="width:100%;">
            <div class="login-icon">🔐</div>
            <h1 class="login-title">Acceso restringido</h1>
            <p class="login-subtitle">Solo administradores pueden crear nuevos perfiles NFC</p>

            <div id="error-box" class="error-msg">Contraseña incorrecta</div>

            <div class="login-form">
                <div class="password-wrapper">
                    <input type="password" id="master-pass" class="input-field" placeholder="Contraseña maestra">
                    <button type="button" class="toggle-pass" id="toggle-pass" title="Mostrar contraseña">👁️</button>
                </div>
                <button onclick="login()" class="btn btn-primary">Acceder</button>
            </div>

            <p class="footer-copyright"><a href="{{ taptumi_landing_url }}" target="_blank" rel="noopener">© <span class="taptumi-year"></span> Taptumi. Todos los derechos reservados.<br>Bucaramanga, Colombia.</a></p></div>
    </div>

    <script>
        document.querySelectorAll('.taptumi-year').forEach(el => {
            el.textContent = new Date().getFullYear();
        });

        async function login() {
            const errorBox = document.getElementById('error-box');
            const pass = document.getElementById('master-pass').value;
            errorBox.style.display = 'none';

            if (!pass) {
                errorBox.textContent = 'Ingresa la contraseña maestra';
                errorBox.style.display = 'block';
                return;
            }

            try {
                const res = await fetch('/create/access', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ master_password: pass })
                });
                const result = await res.json();

                if (result.valid) {
                    window.location.href = '/create';
                } else {
                    errorBox.textContent = result.error || 'Contraseña incorrecta';
                    errorBox.style.display = 'block';
                }
            } catch (e) {
                errorBox.textContent = 'Error de conexión. Intenta de nuevo.';
                errorBox.style.display = 'block';
            }
        }

        document.getElementById('master-pass').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') login();
        });

        document.getElementById('toggle-pass').addEventListener('click', function() {
            const input = document.getElementById('master-pass');
            const isPassword = input.getAttribute('type') === 'password';
            input.setAttribute('type', isPassword ? 'text' : 'password');
            this.textContent = isPassword ? '🙈' : '👁️';
            this.title = isPassword ? 'Ocultar contraseña' : 'Mostrar contraseña';
        });
    </script>
</body>
</html>
