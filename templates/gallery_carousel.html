<!-- templates/gallery_carousel.html -->
<!-- Se incluye dentro de la sección .gallery-section de profile.html,
     que ya provee el título "Galería" — este parcial solo es el carrusel. -->
<div class="carousel-container">
    <button class="carousel-btn prev" onclick="moveCarousel(-1)" aria-label="Anterior">‹</button>

    <div class="carousel-track" id="carouselTrack">
        {% for img in gallery %}
        <div class="carousel-slide">
            <div class="carousel-image-wrapper">
                <img src="{{ img.image_url }}" alt="{{ img.caption or 'Imagen de galería' }}" onclick="openLightbox(this.src)" loading="lazy">
            </div>
            {% if img.caption %}
            <p class="carousel-caption">{{ img.caption }}</p>
            {% endif %}
        </div>
        {% endfor %}
    </div>

    <button class="carousel-btn next" onclick="moveCarousel(1)" aria-label="Siguiente">›</button>
</div>

<div class="carousel-dots" id="carouselDots"></div>

<script>
(function() {
    let currentSlide = 0;
    const track = document.getElementById('carouselTrack');
    if (!track) return;
    const slides = track.children;
    const dotsContainer = document.getElementById('carouselDots');
    const totalSlides = slides.length;

    if (totalSlides === 0) return;

    for (let i = 0; i < totalSlides; i++) {
        const dot = document.createElement('span');
        dot.className = 'carousel-dot' + (i === 0 ? ' active' : '');
        dot.onclick = () => goToSlide(i);
        dotsContainer.appendChild(dot);
    }

    function updateCarousel() {
        track.style.transform = `translateX(-${currentSlide * 100}%)`;
        const dots = dotsContainer.querySelectorAll('.carousel-dot');
        dots.forEach((d, i) => d.classList.toggle('active', i === currentSlide));
    }

    window.moveCarousel = function(dir) {
        currentSlide = (currentSlide + dir + totalSlides) % totalSlides;
        updateCarousel();
    };

    window.goToSlide = function(index) {
        currentSlide = index;
        updateCarousel();
    };

    let autoplay = setInterval(() => window.moveCarousel(1), 5000);
    const container = document.querySelector('.carousel-container');
    container.addEventListener('mouseenter', () => clearInterval(autoplay));
    container.addEventListener('mouseleave', () => {
        autoplay = setInterval(() => window.moveCarousel(1), 3000);
    });

    let touchStartX = 0;
    let touchEndX = 0;
    track.addEventListener('touchstart', e => {
        touchStartX = e.changedTouches[0].screenX;
        clearInterval(autoplay);
    }, {passive: true});
    track.addEventListener('touchend', e => {
        touchEndX = e.changedTouches[0].screenX;
        const diff = touchStartX - touchEndX;
        if (Math.abs(diff) > 50) {
            window.moveCarousel(diff > 0 ? 1 : -1);
        }
        autoplay = setInterval(() => window.moveCarousel(1), 3000);
    }, {passive: true});

    window.openLightbox = function(src) {
        clearInterval(autoplay);
        let lb = document.querySelector('.lightbox-overlay');
        if (lb) lb.remove();

        lb = document.createElement('div');
        lb.className = 'lightbox-overlay';
        lb.innerHTML = `
            <div class="lightbox-close" onclick="closeLightbox()">&times;</div>
            <img src="${src}" alt="Vista ampliada">
        `;
        lb.onclick = (e) => { if(e.target === lb) window.closeLightbox(); };
        document.body.appendChild(lb);

        requestAnimationFrame(() => lb.classList.add('active'));
        document.body.style.overflow = 'hidden';
    };

    window.closeLightbox = function() {
        const lb = document.querySelector('.lightbox-overlay');
        if (lb) {
            lb.classList.remove('active');
            setTimeout(() => {
                lb.remove();
                document.body.style.overflow = '';
                autoplay = setInterval(() => window.moveCarousel(1), 3000);
            }, 300);
        }
    };
})();
</script>
