<!-- templates/gallery_carousel.html -->
<div class="gallery-section">
    <h3 class="gallery-title">Galería</h3>
    
    <div class="carousel-container">
        <button class="carousel-btn prev" onclick="moveCarousel(-1)" aria-label="Anterior">‹</button>
        
        <div class="carousel-track" id="carouselTrack">
            {% for img in gallery %}
            <div class="carousel-slide">
                <div class="carousel-image-wrapper">
                    <img src="{{ img.image_url }}" alt="{{ img.caption or 'Imagen de galería' }}" onclick="openLightbox(this.src)" loading="lazy">
                </div>
                {% if img.caption %}
                <p class="carousel-caption">{{ img.caption }}</p>
                {% endif %}
            </div>
            {% endfor %}
        </div>
        
        <button class="carousel-btn next" onclick="moveCarousel(1)" aria-label="Siguiente">›</button>
    </div>
    
    <div class="carousel-dots" id="carouselDots"></div>
</div>

<style>
.gallery-section {
    margin: 32px 0;
    padding: 0 16px;
}
.gallery-title {
    text-align: center;
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 20px;
    color: #1a1a2e;
}
.carousel-container {
    position: relative;
    width: 100%;
    max-width: 520px;
    margin: 0 auto;
    overflow: hidden;
    border-radius: 20px;
    background: #f8f9fa;
    box-shadow: 0 8px 30px rgba(0,0,0,0.08);
}
.carousel-track {
    display: flex;
    transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    will-change: transform;
}
.carousel-slide {
    min-width: 100%;
    box-sizing: border-box;
}
.carousel-image-wrapper {
    width: 100%;
    height: 380px;
    overflow: hidden;
    background: #e5e7eb;
    display: flex;
    align-items: center;
    justify-content: center;
}
.carousel-slide img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    cursor: zoom-in;
    transition: transform 0.3s ease;
}
.carousel-slide img:hover {
    transform: scale(1.02);
}
.carousel-caption {
    text-align: center;
    padding: 14px 16px;
    font-size: 14px;
    color: #4b5563;
    background: #ffffff;
    margin: 0;
    font-weight: 500;
}
.carousel-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(26, 26, 46, 0.6);
    color: #ffffff;
    border: none;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    font-size: 22px;
    cursor: pointer;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
    transition: background 0.2s, transform 0.15s;
}
.carousel-btn:hover {
    background: rgba(26, 26, 46, 0.9);
    transform: translateY(-50%) scale(1.1);
}
.carousel-btn:active {
    transform: translateY(-50%) scale(0.95);
}
.carousel-btn.prev { left: 12px; }
.carousel-btn.next { right: 12px; }
.carousel-dots {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 16px;
}
.carousel-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #d1d5db;
    cursor: pointer;
    transition: background 0.3s, transform 0.2s;
}
.carousel-dot.active {
    background: #1a1a2e;
    transform: scale(1.2);
}

/* Lightbox */
.lightbox-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.92);
    z-index: 1000;
    justify-content: center;
    align-items: center;
    opacity: 0;
    transition: opacity 0.3s ease;
}
.lightbox-overlay.active {
    display: flex;
    opacity: 1;
}
.lightbox-overlay img {
    max-width: 92%;
    max-height: 88vh;
    border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    transform: scale(0.9);
    transition: transform 0.3s ease;
}
.lightbox-overlay.active img {
    transform: scale(1);
}
.lightbox-close {
    position: absolute;
    top: 20px;
    right: 28px;
    color: #ffffff;
    font-size: 36px;
    cursor: pointer;
    line-height: 1;
    opacity: 0.8;
    transition: opacity 0.2s;
}
.lightbox-close:hover {
    opacity: 1;
}

/* Responsive */
@media (max-width: 480px) {
    .carousel-image-wrapper {
        height: 300px;
    }
    .carousel-btn {
        width: 36px;
        height: 36px;
        font-size: 18px;
    }
    .carousel-btn.prev { left: 8px; }
    .carousel-btn.next { right: 8px; }
}
</style>

<script>
(function() {
    let currentSlide = 0;
    const track = document.getElementById('carouselTrack');
    if (!track) return;
    const slides = track.children;
    const dotsContainer = document.getElementById('carouselDots');
    const totalSlides = slides.length;
    
    if (totalSlides === 0) return;

    // Crear dots
    for (let i = 0; i < totalSlides; i++) {
        const dot = document.createElement('span');
        dot.className = 'carousel-dot' + (i === 0 ? ' active' : '');
        dot.onclick = () => goToSlide(i);
        dotsContainer.appendChild(dot);
    }

    function updateCarousel() {
        track.style.transform = `translateX(-${currentSlide * 100}%)`;
        const dots = dotsContainer.querySelectorAll('.carousel-dot');
        dots.forEach((d, i) => d.classList.toggle('active', i === currentSlide));
    }

    window.moveCarousel = function(dir) {
        currentSlide = (currentSlide + dir + totalSlides) % totalSlides;
        updateCarousel();
    };

    window.goToSlide = function(index) {
        currentSlide = index;
        updateCarousel();
    };

    // Auto-play (pausa al interactuar)
    let autoplay = setInterval(() => window.moveCarousel(1), 5000);
    const container = document.querySelector('.carousel-container');
    container.addEventListener('mouseenter', () => clearInterval(autoplay));
    container.addEventListener('mouseleave', () => {
        autoplay = setInterval(() => window.moveCarousel(1), 5000);
    });

    // Swipe en móvil
    let touchStartX = 0;
    let touchEndX = 0;
    track.addEventListener('touchstart', e => {
        touchStartX = e.changedTouches[0].screenX;
        clearInterval(autoplay);
    }, {passive: true});
    track.addEventListener('touchend', e => {
        touchEndX = e.changedTouches[0].screenX;
        const diff = touchStartX - touchEndX;
        if (Math.abs(diff) > 50) {
            window.moveCarousel(diff > 0 ? 1 : -1);
        }
        autoplay = setInterval(() => window.moveCarousel(1), 5000);
    }, {passive: true});

    // Lightbox
    window.openLightbox = function(src) {
        clearInterval(autoplay);
        let lb = document.querySelector('.lightbox-overlay');
        if (lb) lb.remove();
        
        lb = document.createElement('div');
        lb.className = 'lightbox-overlay';
        lb.innerHTML = `
            <div class="lightbox-close" onclick="closeLightbox()">&times;</div>
            <img src="${src}" alt="Vista ampliada">
        `;
        lb.onclick = (e) => { if(e.target === lb) window.closeLightbox(); };
        document.body.appendChild(lb);
        
        // Forzar reflow para animación
        requestAnimationFrame(() => lb.classList.add('active'));
        document.body.style.overflow = 'hidden';
    };

    window.closeLightbox = function() {
        const lb = document.querySelector('.lightbox-overlay');
        if (lb) {
            lb.classList.remove('active');
            setTimeout(() => {
                lb.remove();
                document.body.style.overflow = '';
                autoplay = setInterval(() => window.moveCarousel(1), 5000);
            }, 300);
        }
    };
})();
</script>
